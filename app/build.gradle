import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: "com.android.application"
apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "com.google.gms.google-services"


android {
    compileSdk 37

    defaultConfig {
        applicationId "com.helpcrunch.demo"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 3
        versionName "3.4.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            debuggable true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_11
        }
    }
    buildFeatures {
        viewBinding true
    }
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    namespace 'com.helpcrunch.demo'
}

dependencies {
    // Multidex
    implementation "androidx.multidex:multidex:2.0.1"

    // AndroidX
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.core:core-splashscreen:1.2.0"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation "com.google.firebase:firebase-messaging"


    // Widgets
    implementation("io.coil-kt.coil3:coil:3.4.0")
    implementation "com.github.TalbotGooday:AvatarView:0.1.4"

    // HelpCrunch
    implementation("com.helpcrunch:chat-sdk:3.4.9")
    // or a snapshot
    //    implementation("com.helpcrunch:chat-sdk:3.4.8+281-SNAPSHOT")
}
